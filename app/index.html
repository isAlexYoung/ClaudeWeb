<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The ClaudeWeb mark: SVG where supported, PNG otherwise; Apple's home screen uses its own size. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=claudeweb" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=claudeweb" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=claudeweb" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>ClaudeWeb</title>

    <!-- ClaudeWeb modification: no Google Fonts request; system fonts are used. -->

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClaudeWeb" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    
    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    

  </body>
</html>
