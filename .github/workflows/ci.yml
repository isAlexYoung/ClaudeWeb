name: CI

# Started by hand (Actions > CI > Run workflow) before a release, and for pull
# requests; pushes to main do not start it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          # A dependency's install step downloads ripgrep from GitHub, which
          # refuses unauthenticated downloads from shared runners at times.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Client tests
        run: npx vitest run
      - name: Server tests
        run: npm test

  package:
    name: Build portable test packages on Ubuntu 22.04
    runs-on: ubuntu-24.04
    # Build native modules on the oldest supported glibc (2.35).
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            git ca-certificates curl xz-utils python3 build-essential pkg-config jq
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Installer output checks
        shell: bash
        run: |
          python3 packaging/sync-platform.py --check
          bash -n install.sh
          python3 packaging/test-install-output.py
          . packaging/platform.sh
          cw_platform_detect
          cw_ensure_minisign
          python3 packaging/test-platform.py
      - name: Packages and lists signed with a key made for this run
        run: bash packaging/ci/prep-test-releases.sh test-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: test-releases
          path: test-releases
          retention-days: 3
          compression-level: 0

  vm:
    name: Fresh ${{ matrix.os }} VM - ${{ matrix.test }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        test: [install, update, browser, devices, sudo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-releases
          path: test-releases
      - name: VM tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; else echo "no KVM: the VM runs without acceleration"; fi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/claudeweb-ci
          key: claudeweb-vm-${{ matrix.os }}-20261122
      - name: Run the test in the VM
        run: python3 packaging/ci/run-vm.py --os ${{ matrix.os }} --test ${{ matrix.test }} --releases test-releases --out vm-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-${{ matrix.os }}-${{ matrix.test }}
          path: vm-results
          retention-days: 7
