name: Check a published release

# Installs a published release in a fresh selected VM exactly as the README
# says, from the public install.sh, the signed list and the GitHub Release.
# Run it after publishing, and again after promoting a release to stable.

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target OS must be declared by the package (2.0.3 excludes Debian 13 and Ubuntu 24.04/26.04)'
        required: true
        default: debian-12
        type: choice
        options: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
      version:
        description: 'Published version, for example 2.0.0'
        required: true
        type: string
      from:
        description: 'Optional: install this published version first, then update to the one above'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  public-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: VM tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/claudeweb-ci
          key: claudeweb-vm-${{ inputs.os }}-20261122
      - name: Public one-line install (and update) in a fresh VM
        env:
          VERSION: ${{ inputs.version }}
          FROM: ${{ inputs.from }}
          TARGET_OS: ${{ inputs.os }}
        run: python3 packaging/ci/run-vm.py --os "$TARGET_OS" --test public --version "$VERSION" ${FROM:+--from "$FROM"} --out vm-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-install-${{ inputs.os }}-${{ inputs.version }}
          path: vm-results
          retention-days: 7
